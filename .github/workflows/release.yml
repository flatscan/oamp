name: Release

# Builds release artifacts when a version tag such as v1.0.0 is pushed, or on
# demand. Test builds stay in ci.yml and keep using the public side-load key;
# this workflow refuses to fall back to it.
#
# On a tag push it also creates a draft GitHub release for the tag with the
# Android APK, the Windows installer and a zip of the Windows app attached.
# The release notes come from docs/releases/<tag>.md. Nothing is public until
# a maintainer reviews the draft and presses Publish.
#
# Secrets (see docs/signing.md):
#   OAMP_RELEASE_KEYSTORE_BASE64, OAMP_RELEASE_KEYSTORE_PASSWORD,
#   OAMP_RELEASE_KEY_ALIAS, OAMP_RELEASE_KEY_PASSWORD   (required)
#   OAMP_UPLOAD_KEYSTORE_BASE64, OAMP_UPLOAD_KEYSTORE_PASSWORD,
#   OAMP_UPLOAD_KEY_ALIAS, OAMP_UPLOAD_KEY_PASSWORD     (optional, Google Play)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    # GitHub creates the "release" environment on first use. Adding a
    # required reviewer to it in the repo settings makes every signed
    # release wait for an approval click.
    environment: release
    env:
      OAMP_REQUIRE_RELEASE_KEY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.OAMP_RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.OAMP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::OAMP_RELEASE_KEYSTORE_BASE64 is not set; see docs/signing.md"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/release.jks"
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/upload.jks"
            echo "HAS_UPLOAD_KEY=true" >> "$GITHUB_ENV"
          fi

      # The run number is the version code, so every release is newer than
      # the one before it (Google Play requires that).
      - name: Build release APK
        env:
          OAMP_KEYSTORE: ${{ runner.temp }}/keys/release.jks
          OAMP_KEYSTORE_PASSWORD: ${{ secrets.OAMP_RELEASE_KEYSTORE_PASSWORD }}
          OAMP_KEY_ALIAS: ${{ secrets.OAMP_RELEASE_KEY_ALIAS }}
          OAMP_KEY_PASSWORD: ${{ secrets.OAMP_RELEASE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=OAMP_RELEASE_TAG=${{ github.ref_name }}
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk "build/release/oamp-${GITHUB_REF_NAME//\//-}.apk"

      - name: Check the APK is not signed with the side-load key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/release/*.apk | tee certs.txt
          if grep -q "OAmp side-load build" certs.txt; then
            echo "::error::Release APK is signed with the public side-load key"
            exit 1
          fi

      - name: Build Play bundle (upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          OAMP_KEYSTORE: ${{ runner.temp }}/keys/upload.jks
          OAMP_KEYSTORE_PASSWORD: ${{ secrets.OAMP_UPLOAD_KEYSTORE_PASSWORD }}
          OAMP_KEY_ALIAS: ${{ secrets.OAMP_UPLOAD_KEY_ALIAS }}
          OAMP_KEY_PASSWORD: ${{ secrets.OAMP_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=OAMP_RELEASE_TAG=${{ github.ref_name }}
          cp build/app/outputs/bundle/release/app-release.aab "build/release/oamp-${GITHUB_REF_NAME//\//-}.aab"

      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        with:
          name: oamp-android-release
          path: build/release/*
          if-no-files-found: error

  # Unsigned until Windows code signing is set up (see docs/signing.md).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=OAMP_RELEASE_TAG=${{ github.ref_name }}
      - name: Check native plugin DLLs shipped
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          foreach ($dll in 'smtc_windows.dll', 'libmpv-2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path "$dir/$dll")) { throw "$dll missing from the Windows build" }
          }
      - name: Build installer and zip
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer\oamp.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $name = "oamp-$($env:GITHUB_REF_NAME -replace '/', '-')"
          New-Item -ItemType Directory -Force build/release | Out-Null
          Copy-Item (Get-ChildItem build/installer/*.exe | Select-Object -First 1) "build/release/$name-windows-setup.exe"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/release/$name-windows.zip"
          Get-ChildItem build/release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: oamp-windows-release
          path: build/release/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          # The Play bundle is for Google Play only, so it is not attached.
          rm -f dist/*.aab
          ls -l dist
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --draft $prerelease \
            --title "OAmp ${TAG#v}" --notes-file "$notes"
