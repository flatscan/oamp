name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Check native plugin DLLs shipped
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($dll in 'smtc_windows.dll', 'libmpv-2.dll') {
            if (-not (Test-Path "$dir/$dll")) { throw "$dll missing from the Windows build" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: oamp-windows
          path: build/windows/x64/runner/Release/
