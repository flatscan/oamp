name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart, which the
          # analyzer reports in every file until the app moves to material_ui.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart, which the
          # analyzer reports in every file until the app moves to material_ui.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # The run number as the version code, so each CI build installs over
      # the previous one. OAMP_CI_RUN names it "Test build #N" in Settings.
      - name: Build APK (retry on transient network failures)
        run: |
          for attempt in 1 2 3; do
            set +e
            flutter build apk --release --build-number=${{ github.run_number }} --dart-define=OAMP_CI_RUN=${{ github.run_number }} 2>&1 | tee /tmp/flutter-android-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -Eiq "HTTP response code: 5[0-9]{2}|timed out|timeout|connection reset|temporary failure in name resolution|could not resolve host|network is unreachable" /tmp/flutter-android-build.log; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep 15
          done
      - name: Name the APK
        run: |
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk build/apk/oamp-${{ github.run_number }}.apk
          ls -l build/apk
      - uses: actions/upload-artifact@v4
        with:
          name: oamp-android
          path: build/apk/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart, which the
          # analyzer reports in every file until the app moves to material_ui.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=OAMP_CI_RUN=${{ github.run_number }}
      - name: Check native plugin DLLs shipped
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($dll in 'smtc_windows.dll', 'libmpv-2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path "$dir/$dll")) { throw "$dll missing from the Windows build" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: oamp-windows
          path: build/windows/x64/runner/Release/
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer\oamp.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem build/installer | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: oamp-windows-installer
          path: build/installer/*.exe
          if-no-files-found: error
